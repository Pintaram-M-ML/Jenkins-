apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuber-site
  labels:
    app: kuber-site
spec:
  replicas: 10
  selector:
    matchLabels:
      app: kuber-site
  template:
    metadata:
      labels:
        app: kuber-site
    spec:
      containers:
        - name: kuber-site
          image: pintaram369/kuber-site:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
