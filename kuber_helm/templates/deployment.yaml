apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuber_helm.fullname" . }}
  labels:
    {{- include "kuber_helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kuber_helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuber_helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: kuber-site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP